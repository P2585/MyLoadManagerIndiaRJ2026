
name: Build My Load Manager India

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Extract Source
        run: |
          mkdir -p source
          unzip -q MyLoadManagerIndia_V0.4_Source.zip -d source

      - name: Build APK
        run: gradle -p source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLoadManagerIndia-APK
          path: source/app/build/outputs/apk/debug/*.apk
          
